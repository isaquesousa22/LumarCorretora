<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Acesso Negado</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>


<body class="min-h-screen bg-base-200 flex items-center justify-center">

    <main class="card bg-base-100 shadow-xl w-11/12 max-w-lg">

        <div class="card-body items-center text-center">

            <div class="bg-error/20 p-5 rounded-full">

                <i data-lucide="shield-alert" class="w-16 h-16 text-error">
                </i>

            </div>

            <h1 class="text-7xl font-bold text-error mt-5">
                403
            </h1>


            <h2 class="text-3xl font-semibold">
                Acesso Negado
            </h2>


            <p class="text-base-content/70 mt-3">

                Você não possui permissão para acessar esta página.

                <br>

                Entre em contato com o administrador se acredita que isso é um erro.

            </p>



            <div class="card-actions mt-6">


                <a href="dashboard.html" class="btn btn-primary">

                    <i data-lucide="home"></i>

                    Voltar ao painel

                </a>


                <a href="index.html" class="btn btn-outline">

                    Página inicial

                </a>


            </div>


        </div>

    </main>



    <script>

        lucide.createIcons();

    </script>


</body>

</html>
