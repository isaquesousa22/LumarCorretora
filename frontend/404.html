<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página não encontrada</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body class="min-h-screen bg-base-200 flex items-center justify-center">


    <main class="card bg-base-100 shadow-xl w-11/12 max-w-lg">


        <div class="card-body items-center text-center">


            <div class="bg-warning/20 p-5 rounded-full">

                <i data-lucide="search-x" class="w-16 h-16 text-warning">
                </i>

            </div>



            <h1 class="text-7xl font-bold text-warning mt-5">

                404

            </h1>



            <h2 class="text-3xl font-semibold">

                Página não encontrada

            </h2>



            <p class="text-base-content/70 mt-3">

                A página que você tentou acessar não existe
                ou foi removida.

            </p>



            <div class="card-actions mt-6">


                <a href="index.html" class="btn btn-primary">

                    <i data-lucide="home"></i>

                    Página inicial

                </a>



                <a href="dashboard.html" class="btn btn-outline">

                    Dashboard

                </a>


            </div>


        </div>


    </main>



    <script>

        lucide.createIcons();

    </script>


</body>

</html>
